name: CI/CD

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  # ============================================================================
  # Job 1 — Test & Analyze
  # Runs on every push and every pull request to master.
  # ============================================================================
  test:
    name: Test & Analyze
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      # fetch-depth: 0 gives SonarCloud the full history it needs for
      # blame data and PR decoration; a shallow clone produces empty blame.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Java ─────────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── Gradle ───────────────────────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # ── Android SDK path ─────────────────────────────────────────────────────
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      # ── Unit Tests ───────────────────────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      # ── KVM (hardware acceleration for the Android emulator) ─────────────────
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── AVD Cache ────────────────────────────────────────────────────────────
      - name: Cache Android emulator AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-aosp_atd-${{ runner.os }}

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: false
          script: echo "AVD snapshot ready"

      # ── Instrumented Tests ───────────────────────────────────────────────────
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected/
          retention-days: 7

      # ── JaCoCo Coverage Report ───────────────────────────────────────────────
      - name: Generate JaCoCo coverage report
        run: ./gradlew jacocoDebugCoverageReport

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/debug/
          retention-days: 14

      # ── SonarCloud Analysis ──────────────────────────────────────────────────
      # sonar.qualitygate.wait=true blocks the step until SonarCloud returns a
      # gate result and fails the job if the gate is not green — preventing a
      # release from shipping code that violates quality rules.
      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar --info -Dsonar.qualitygate.wait=true

  # ============================================================================
  # Job 2 — Sign & Deploy to Internal Testing
  # Runs only after the test job passes, and only on master (not PRs).
  # Computes the next versionCode, builds a signed AAB, uploads it to the
  # Play Store internal track, then commits the version bump back to master.
  # ============================================================================
  release:
    name: Sign & Deploy to Internal Testing
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Java ─────────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── Gradle ───────────────────────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # ── Android SDK path ─────────────────────────────────────────────────────
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      # ── Version Code ─────────────────────────────────────────────────────────
      # Scheme: YYYYMMDDn where n is omitted for the first release of the day,
      # then 1, 2, 3 … for subsequent releases on the same calendar day (UTC).
      #
      # Examples for 2026-05-19:
      #   First release  → 20260519
      #   Second release → 202605191
      #   Third release  → 202605192
      - name: Compute and bump versionCode
        id: version
        run: |
          DATE=$(date -u +%Y%m%d)
          CURRENT=$(grep -oP '(?<=versionCode = )\d+' app/build.gradle.kts)

          if [[ "$CURRENT" == "${DATE}"* ]]; then
            SUFFIX="${CURRENT#$DATE}"
            if [[ -z "$SUFFIX" ]]; then
              NEW_N=1
            else
              NEW_N=$((SUFFIX + 1))
            fi
            NEW_CODE="${DATE}${NEW_N}"
          else
            NEW_CODE="${DATE}"
          fi

          sed -i "s/versionCode = ${CURRENT}/versionCode = ${NEW_CODE}/" app/build.gradle.kts
          echo "version_code=${NEW_CODE}" >> "$GITHUB_OUTPUT"
          echo "Bumped versionCode: ${CURRENT} → ${NEW_CODE}"

      # ── Keystore ─────────────────────────────────────────────────────────────
      # KEYSTORE_BASE64 is the release keystore encoded with:
      #   base64 -i your-upload-key.jks | pbcopy   (macOS)
      # Store the result as a GitHub Actions secret named KEYSTORE_BASE64.
      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > "${{ github.workspace }}/release.jks"

      # ── Build signed release AAB ──────────────────────────────────────────────
      # The signing config in app/build.gradle.kts reads these four env vars.
      - name: Build signed release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # ── Upload to Google Play ────────────────────────────────────────────────
      # PLAY_SERVICE_ACCOUNT_JSON is the full JSON content of a Google Cloud
      # service account that has been granted the "Release Manager" role in
      # Play Console → Users and permissions → Invite new users.
      - name: Upload AAB to Google Play (internal testing)
        uses: r0adkll/upload-google-play@v3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.unstampedpages.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # ── Commit version bump ───────────────────────────────────────────────────
      # [skip ci] prevents this commit from re-triggering the workflow.
      - name: Commit versionCode bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "ci: bump versionCode to ${{ steps.version.outputs.version_code }} [skip ci]"
          git push origin HEAD:master
