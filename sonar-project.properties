sonar.host.url=https://sonarcloud.io
sonar.organization=jpdust
sonar.projectKey=jpdust_up-android
sonar.projectName=up-android

# Explicitly declare main sources and test sources so Sonar correctly classifies
# androidTest helpers (e.g. Robot classes) as test code, not production code.
# Without this, Sonar auto-discovers all .kt files and treats every file without
# "Test" in its name as a main source — causing test helpers like MyStampsRobot.kt
# to be measured for coverage against Jacoco data that only covers src/main/java.
sonar.sources=app/src/main/java
sonar.tests=app/src/test/java,app/src/androidTest/java

# Compiled Kotlin classes — AGP 9.x output paths for the debug variant.
# The androidTest path is included so Sonar can correlate bytecode for test-helper
# files (e.g. Robot classes) with the coverage data in the Jacoco XML.
sonar.java.binaries=\
  app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes,\
  app/build/intermediates/built_in_kotlinc/debugAndroidTest/compileDebugAndroidTestKotlin/classes

# JaCoCo XML coverage reports (debug + release)
sonar.coverage.jacoco.xmlReportPaths=\
  app/build/reports/jacoco/debug/jacoco.xml,\
  app/build/reports/jacoco/release/jacoco.xml

# Exclude generated / framework code from analysis and coverage
sonar.exclusions=**/R.class,**/R$*.class,**/BuildConfig.*,**/Manifest*.*,android/**/*.*
sonar.coverage.exclusions=**/R.class,**/R$*.class,**/BuildConfig.*,**/Manifest*.*,**/*Test*.*,**/androidTest/**/*.*,android/**/*.*

# Android Lint report
sonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml

# Block the CI step until SonarCloud returns a quality gate result
sonar.qualitygate.wait=true
