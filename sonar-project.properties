sonar.host.url=https://sonarcloud.io
sonar.organization=jpdust
sonar.projectKey=jpdust_up-android
sonar.projectName=up-android

# Compiled Kotlin classes — AGP 9.x output path for the debug variant
sonar.java.binaries=app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes

# JaCoCo XML coverage reports (debug + release)
sonar.coverage.jacoco.xmlReportPaths=\
  app/build/reports/jacoco/debug/jacoco.xml,\
  app/build/reports/jacoco/release/jacoco.xml

# Exclude generated / framework code from analysis and coverage
sonar.exclusions=**/R.class,**/R$*.class,**/BuildConfig.*,**/Manifest*.*,android/**/*.*
sonar.coverage.exclusions=**/R.class,**/R$*.class,**/BuildConfig.*,**/Manifest*.*,**/*Test*.*,**/androidTest/**/*.*,android/**/*.*

# Android Lint report
sonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml

# Block the CI step until SonarCloud returns a quality gate result
sonar.qualitygate.wait=true
