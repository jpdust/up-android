# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# Non-final resource IDs
android.nonFinalResIds=true

# Prevent android:testOnly="true" from being injected into the debug manifest.
# AGP sets testOnly when compileSdk is detected as a preview API level, which
# causes PackageManager.resolveActivity() to return null on API 34+ emulators
# and breaks createAndroidComposeRule / ActivityScenario.launch(Class).
android.injected.testOnly=false

# Other settings
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.newDsl=false
